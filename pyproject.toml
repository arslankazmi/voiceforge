[project]
name = "voiceforge"
version = "0.1.0"
description = "Portable .voice artifacts — forge a voice from a clip, then play it or serve it, all on-device."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arslan Kazmi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "psutil>=5.9",  # system-RAM preflight before loading heavy torch models (OOM safety)
]

[project.optional-dependencies]
# Voice cloning engine — Chatterbox base + Turbo (MIT). PULLS TORCH (~1.5 GB) and
# downloads model weights from HuggingFace on first use. soundfile enables the
# >5s Turbo reference-clip duration check.
clone = ["chatterbox-tts>=0.1.7", "soundfile>=0.12"]

[project.scripts]
voiceforge = "voiceforge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.10", "ruff>=0.4"]

[tool.uv]
default-groups = ["dev"]
# chatterbox-tts (>=0.1.7) declares numpy<2; force numpy 2.x (runs fine in practice).
# Cap below 2.5 because numba (via librosa) requires NumPy <= 2.4.
override-dependencies = ["numpy>=2.0.2,<2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
